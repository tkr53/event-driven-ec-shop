syntax = "proto3";
package domain.inventory;

option go_package = "github.com/example/ec-event-driven/proto/domain/inventorypb";

// Commands
message AddStockCommand {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveStockCommand {
  string product_id = 1;
  string order_id = 2;
  int32 quantity = 3;
}

message ReleaseStockCommand {
  string product_id = 1;
  string order_id = 2;
  int32 quantity = 3;
}

message DeductStockCommand {
  string product_id = 1;
  string order_id = 2;
  int32 quantity = 3;
}

// Events
message StockAddedEvent {
  string product_id = 1;
  int32 quantity = 2;
  string added_at = 3;
}

message StockReservedEvent {
  string product_id = 1;
  string order_id = 2;
  int32 quantity = 3;
  string reserved_at = 4;
}

message StockReleasedEvent {
  string product_id = 1;
  string order_id = 2;
  int32 quantity = 3;
  string released_at = 4;
}

message StockDeductedEvent {
  string product_id = 1;
  string order_id = 2;
  int32 quantity = 3;
  string deducted_at = 4;
}

// Snapshot
message InventorySnapshot {
  string product_id = 1;
  int32 total_stock = 2;
  int32 reserved_stock = 3;
}

// Response
message InventoryResponse {
  string product_id = 1;
  int32 total_stock = 2;
  int32 reserved_stock = 3;
  int32 available_stock = 4;
}
