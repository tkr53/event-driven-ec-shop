syntax = "proto3";
package domain.category;

option go_package = "github.com/example/ec-event-driven/proto/domain/categorypb";

// Commands
message CreateCategoryCommand {
  string name = 1;
  string slug = 2;
  string description = 3;
  string parent_id = 4;
  int32 sort_order = 5;
}

message UpdateCategoryCommand {
  string category_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string parent_id = 5;
  int32 sort_order = 6;
}

message DeleteCategoryCommand {
  string category_id = 1;
}

// Events
message CategoryCreatedEvent {
  string category_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string parent_id = 5;
  int32 sort_order = 6;
  string created_at = 7;
}

message CategoryUpdatedEvent {
  string category_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string parent_id = 5;
  int32 sort_order = 6;
  string updated_at = 7;
}

message CategoryDeletedEvent {
  string category_id = 1;
  string deleted_at = 2;
}

// Snapshot
message CategorySnapshot {
  string id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string parent_id = 5;
  int32 sort_order = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
}
